name: Build and Release Installer

# Builds the Windows installer AND the (unsigned) Mac disk image, on their
# respective native runners, and publishes both as GitHub Release assets:
#   StatusUpdate-Setup.exe
#   StatusUpdate-Setup.dmg
# Neither filename changes between releases, so these permanent links
# always point at the newest build of each:
#   https://github.com/<owner>/<repo>/releases/latest/download/StatusUpdate-Setup.exe
#   https://github.com/<owner>/<repo>/releases/latest/download/StatusUpdate-Setup.dmg
# The .exe link is what's stored in the Google Sheet's _Config tab as
# DownloadUrl (set once, never needs updating again).
#
# The Mac build is unsigned (no Apple Developer account in this project) —
# `"identity": null` in package.json tells electron-builder not to even
# attempt it. That means Gatekeeper will flag it as from an "unidentified
# developer": teammates need to right-click the app -> Open the first time
# (or System Settings -> Privacy & Security -> "Open Anyway") instead of
# just double-clicking. Real code signing needs a paid Apple Developer
# account, which is a call for whoever owns this project to make.
#
# Triggered by a "v*.*.*" tag push — which you never have to do by hand:
# auto-tag-release.yml pushes that tag itself the moment a version bump in
# desktop-widget-electron/package.json lands on main. So shipping a new
# version is just "bump the version, commit, push"; this workflow then
# builds both installers, releases them, and tells the running app about
# the new version automatically (via the setLatestVersion action in
# Code.gs) — once, not once per platform, since it's the same version
# either way.
#
# One-time setup required (see README.md "Continuous deployment" section):
#   Add a repo secret named CONFIG_TEMPLATE_JSON containing the exact JSON
#   from desktop-widget-electron/config.template.json (WEBHOOK_URL/TOKEN/SHEET_URL).

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false # a Mac build hiccup shouldn't block the Windows release, or vice versa
      max-parallel: 1 # both legs upload to the SAME GitHub Release — run sequentially, not racing each other creating/updating it
      matrix:
        include:
          - os: windows-latest
            build-script: build:win
            artifact: StatusUpdate-Setup.exe
          - os: macos-latest
            build-script: build:mac
            artifact: StatusUpdate-Setup.dmg
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop-widget-electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write shared config
        shell: bash
        env:
          CONFIG_TEMPLATE_JSON: ${{ secrets.CONFIG_TEMPLATE_JSON }}
        run: |
          if [ -z "$CONFIG_TEMPLATE_JSON" ]; then
            echo "::error::CONFIG_TEMPLATE_JSON secret is not set. See README.md for setup steps."
            exit 1
          fi
          echo "$CONFIG_TEMPLATE_JSON" > config.template.json

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run ${{ matrix.build-script }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: desktop-widget-electron/dist/${{ matrix.artifact }}
          name: ${{ github.ref_name }}
          generate_release_notes: true

      - name: Tell the app about the new version
        if: matrix.os == 'windows-latest' # same version either way — only need to say it once
        shell: bash
        run: |
          WEBHOOK_URL=$(node -pe "require('./config.template.json').WEBHOOK_URL")
          TOKEN=$(node -pe "require('./config.template.json').TOKEN")
          VERSION="${GITHUB_REF_NAME#v}"
          curl -sf -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TOKEN\",\"action\":\"setLatestVersion\",\"version\":\"$VERSION\"}"
