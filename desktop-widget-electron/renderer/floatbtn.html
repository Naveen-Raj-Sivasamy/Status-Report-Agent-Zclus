<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  /* Outer: just a transparent drag rim, no visible styling at all. */
  #btn {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none;
    -webkit-app-region: drag;
  }
  /* Inner: the click target — your icon exactly as uploaded, no background/border.
     Deliberately left as a `drag` region (same as #btn, not `no-drag`): a
     plain click still fires normally as long as the mouse doesn't move, so
     clicking still opens the popup — but now grabbing the icon itself (not
     just the thin rim around it) also drags the window, which is what
     people naturally try first. */
  #hit {
    width: 55px; height: 55px; /* 46 +20% — was reading smaller than other desktop icons */
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-app-region: drag;
  }
  #hit img {
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; /* clicks land on #hit, not the image itself */
  }
</style>
</head>
<body>
  <div id="btn">
    <div id="hit">
      <img src="../build/fab.png" alt="" />
    </div>
  </div>
<script>
  const hit = document.getElementById('hit');
  hit.addEventListener('click', () => window.statusApp.fabClicked());
  hit.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.statusApp.showFabMenu();
  });
</script>
</body>
</html>
