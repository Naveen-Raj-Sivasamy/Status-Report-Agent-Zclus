name: Auto Tag Release

# Removes the last manual step in shipping a new widget build. Previously
# you had to bump "version" in desktop-widget-electron/package.json, push,
# and THEN manually run:
#   git tag v<version> && git push origin v<version>
# ...to actually trigger build-release.yml. This workflow does that tag/push
# for you automatically, the moment a version bump lands on main — so
# shipping a new version is just "bump the version, commit, push" and
# everything downstream (installer build, GitHub Release, LatestVersion
# bump in the sheet) happens with zero manual intervention.
#
# Safe to re-run / re-push without side effects: if the tag for the current
# version already exists, this is a no-op.
#
# IMPORTANT: a tag pushed using the default GITHUB_TOKEN does NOT trigger
# other workflows — GitHub deliberately blocks event chaining through the
# built-in token to stop runaway loops. So pushing the tag alone would
# silently never build anything. Instead of working around that with a
# personal access token (one more secret to create and rotate), we push
# the tag for the record/history and then explicitly kick off
# build-release.yml ourselves via `gh workflow run`, which — unlike a
# push event — GITHUB_TOKEN IS allowed to do.

on:
  push:
    branches: [main]
    paths:
      - 'desktop-widget-electron/package.json'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: v
        run: |
          VERSION=$(node -pe "require('./desktop-widget-electron/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push tag if it doesn't exist yet
        id: create_tag
        env:
          TAG: v${{ steps.v.outputs.version }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do (version wasn't bumped, or was already released)."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Trigger the release build
        if: steps.create_tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.v.outputs.version }}
        run: |
          gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          echo "Dispatched build-release.yml for $TAG."
