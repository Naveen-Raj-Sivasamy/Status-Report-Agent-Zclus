<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    -webkit-app-region: drag; /* whole button is the drag handle */
  }
  #btn {
    width: 56px; height: 56px; border-radius: 50%;
    background: #6e1b2c;
    border: 2px solid rgba(255,255,255,0.85);
    box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-user-select: none;
  }
  #btn img {
    width: 34px; height: 34px; object-fit: contain;
    -webkit-app-region: no-drag; /* clicks on the icon still toggle, drag still works via body */
    pointer-events: none; /* let clicks pass through to #btn's own handler */
  }
  #btn:active { transform: scale(0.94); }
</style>
</head>
<body>
  <div id="btn">
    <img src="../build/fab.png" alt="" />
  </div>
<script>
  const btn = document.getElementById('btn');
  let downAt = 0;

  btn.addEventListener('mousedown', () => { downAt = Date.now(); });
  btn.addEventListener('mouseup', () => {
    // Treat as a click only if it wasn't a drag (quick press+release).
    if (Date.now() - downAt < 300) window.statusApp.fabClicked();
  });
  btn.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.statusApp.showFabMenu();
  });
</script>
</body>
</html>
