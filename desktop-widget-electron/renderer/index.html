<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Status Update</title>
<style>
  :root {
    --bg: #1c1e26;
    --card: #23262f;
    --card-hover: #2b2f3a;
    --border: #343846;
    --text: #f2f3f5;
    --text-dim: #9aa0ac;
    --accent: #4f7cff;
    --accent-hover: #5f8aff;
    --danger: #ef5a5a;
    --success: #3ec97a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: transparent;
    -webkit-app-region: no-drag;
    user-select: none;
  }
  #card {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    overflow: hidden;
  }
  header {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 {
    font-size: 14px; font-weight: 600; color: var(--text); margin: 0;
    letter-spacing: 0.2px;
  }
  header .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  #close-btn {
    -webkit-app-region: no-drag;
    background: none; border: none; color: var(--text-dim);
    font-size: 16px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  #close-btn:hover { background: var(--card-hover); color: var(--text); }

  main { flex: 1; overflow-y: auto; padding: 14px 16px; }

  .tab-btn {
    width: 100%; text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 13px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.12s ease, transform 0.06s ease;
  }
  .tab-btn:hover { background: var(--card-hover); }
  .tab-btn:active { transform: scale(0.98); }

  .field { margin-bottom: 12px; }
  .field label {
    display: block; font-size: 11px; color: var(--text-dim);
    margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.4px;
  }
  .field textarea, .field input {
    width: 100%; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); padding: 9px 10px; font-size: 13px;
    font-family: inherit; resize: vertical; min-height: 34px;
  }
  .field textarea:focus, .field input:focus {
    outline: none; border-color: var(--accent);
  }

  footer {
    padding: 12px 16px; border-top: 1px solid var(--border);
    display: flex; gap: 8px; justify-content: flex-end;
  }
  button.primary, button.secondary {
    -webkit-app-region: no-drag;
    border: none; border-radius: 8px; padding: 9px 16px;
    font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary { background: transparent; color: var(--text-dim); }
  button.secondary:hover { color: var(--text); }

  #status-view {
    flex: 1; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; padding: 24px; text-align: center;
  }
  #status-view .icon { font-size: 32px; }
  #status-view .msg { font-size: 13px; color: var(--text); }
  #status-view .err { font-size: 11px; color: var(--text-dim); word-break: break-word; }
  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="card">
    <header>
      <div>
        <h1 id="header-title">Status Update</h1>
        <div class="sub" id="header-sub">What are you logging status for?</div>
      </div>
      <button id="close-btn" title="Close">✕</button>
    </header>

    <main id="main"></main>

    <footer id="footer" class="hidden">
      <button class="secondary" id="cancel-btn">Cancel</button>
      <button class="primary" id="submit-btn">Submit</button>
    </footer>
  </div>

<script>
  const els = {
    title: document.getElementById('header-title'),
    sub: document.getElementById('header-sub'),
    main: document.getElementById('main'),
    footer: document.getElementById('footer'),
    submitBtn: document.getElementById('submit-btn'),
    cancelBtn: document.getElementById('cancel-btn'),
    closeBtn: document.getElementById('close-btn'),
  };

  let yourName = '';

  function showLoading(msg) {
    els.footer.classList.add('hidden');
    els.sub.textContent = '';
    els.main.innerHTML = `
      <div id="status-view">
        <div class="spinner"></div>
        <div class="msg">${msg}</div>
      </div>`;
  }

  function showError(msg, retryFn) {
    els.footer.classList.add('hidden');
    els.main.innerHTML = `
      <div id="status-view">
        <div class="icon">⚠️</div>
        <div class="msg">Couldn't reach the sheet</div>
        <div class="err">${escapeHtml(msg)}</div>
        <button class="primary" id="retry-btn" style="margin-top:6px;">Retry</button>
      </div>`;
    document.getElementById('retry-btn').onclick = retryFn;
  }

  function showSuccess(tab) {
    els.footer.classList.add('hidden');
    els.sub.textContent = '';
    els.main.innerHTML = `
      <div id="status-view">
        <div class="icon">✅</div>
        <div class="msg">Saved to "${escapeHtml(tab)}"</div>
      </div>`;
    setTimeout(() => window.statusApp.hideWindow(), 1100);
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = String(s);
    return d.innerHTML;
  }

  async function showTabPicker() {
    els.title.textContent = 'Status Update';
    els.sub.textContent = 'What are you logging status for?';
    els.footer.classList.add('hidden');
    showLoading('Loading categories…');
    try {
      const { tabs } = await window.statusApp.getTabs();
      els.main.innerHTML = '';
      tabs.forEach((tab) => {
        const btn = document.createElement('button');
        btn.className = 'tab-btn';
        btn.textContent = tab;
        btn.onclick = () => showForm(tab);
        els.main.appendChild(btn);
      });
    } catch (err) {
      showError(err.message || String(err), showTabPicker);
    }
  }

  async function showForm(tab) {
    els.title.textContent = tab;
    els.sub.textContent = '';
    showLoading('Loading fields…');
    try {
      const { columns } = await window.statusApp.getColumns(tab);
      els.main.innerHTML = '';
      const inputs = {};
      columns.forEach((col) => {
        const wrap = document.createElement('div');
        wrap.className = 'field';
        const label = document.createElement('label');
        label.textContent = col;
        const isLong = /notes|description|blocker|comment|detail/i.test(col);
        const input = document.createElement(isLong ? 'textarea' : 'input');
        if (isLong) input.rows = 2;
        if (/name/i.test(col) && yourName) input.value = yourName;
        wrap.appendChild(label);
        wrap.appendChild(input);
        els.main.appendChild(wrap);
        inputs[col] = input;
      });

      els.footer.classList.remove('hidden');
      els.cancelBtn.onclick = showTabPicker;
      els.submitBtn.onclick = async () => {
        els.submitBtn.disabled = true;
        els.submitBtn.textContent = 'Saving…';
        const values = {};
        Object.entries(inputs).forEach(([k, el]) => (values[k] = el.value.trim()));
        try {
          await window.statusApp.submitEntry(tab, values);
          showSuccess(tab);
        } catch (err) {
          showError(err.message || String(err), () => showForm(tab));
        }
      };
    } catch (err) {
      showError(err.message || String(err), () => showForm(tab));
    }
  }

  els.closeBtn.onclick = () => window.statusApp.hideWindow();

  window.statusApp.onOpened(async () => {
    yourName = await window.statusApp.getYourName();
    showTabPicker();
  });

  // First load too, in case 'opened' already fired before listener attached.
  window.statusApp.getYourName().then((n) => (yourName = n));
  showTabPicker();
</script>
</body>
</html>
