<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
  }
  /* Outer: just a transparent drag rim, no visible styling at all. */
  #btn {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    -webkit-user-select: none;
    -webkit-app-region: drag;
  }
  /* Inner: the click target — your icon exactly as uploaded, no background/border.
     `no-drag`, not `drag`: on Windows, Electron's native app-region drag
     does NOT reliably let a plain click through underneath it — it was
     tried (`drag` here, matching #btn) as the "simple" fix for dragging by
     the icon, but that ended up swallowing single clicks entirely instead.
     Dragging-by-the-icon is implemented by hand below instead, entirely in
     JS via mousedown/mousemove + moveFloatBtnBy — see the script. */
  #hit {
    width: 55px; height: 55px; /* 46 +20% — was reading smaller than other desktop icons */
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    -webkit-app-region: no-drag;
  }
  #hit img {
    width: 100%; height: 100%; object-fit: contain;
    pointer-events: none; /* clicks land on #hit, not the image itself */
  }
</style>
</head>
<body>
  <div id="btn">
    <div id="hit">
      <img src="../build/fab.png" alt="" />
    </div>
  </div>
<script>
  const hit = document.getElementById('hit');

  // Manual click-vs-drag: #hit is `no-drag` (see CSS) so it always gets a
  // real, reliable click event — then we tell drag apart from click
  // ourselves by watching whether the mouse actually moved before it came
  // back up, instead of leaning on Electron's native app-region drag
  // (which was the earlier, broken attempt at this).
  const DRAG_THRESHOLD_PX = 4; // small moves while clicking shouldn't count as a drag
  let dragOrigin = null; // {x, y} in screen coords, set on mousedown, cleared on mouseup
  let didDrag = false;   // read (and reset) by the click handler right after mouseup

  hit.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return; // left button only
    dragOrigin = { x: e.screenX, y: e.screenY };
    didDrag = false;
  });

  window.addEventListener('mousemove', (e) => {
    if (!dragOrigin) return;
    const dx = e.screenX - dragOrigin.x;
    const dy = e.screenY - dragOrigin.y;
    if (!didDrag && Math.hypot(dx, dy) < DRAG_THRESHOLD_PX) return;
    didDrag = true;
    window.statusApp.moveFloatBtnBy(dx, dy);
    dragOrigin = { x: e.screenX, y: e.screenY }; // deltas from here on, not from the original point
  });

  window.addEventListener('mouseup', (e) => {
    dragOrigin = null; // didDrag is left as-is on purpose — the click handler below still needs it
    // A fast drag can end with the cursor no longer over #hit (the window
    // is still catching up to the cursor mid-drag) — re-check here so the
    // window doesn't get stuck fully-interactive (i.e. still blocking
    // clicks to whatever's underneath) after letting go outside the icon.
    if (!isOverHit(e.clientX, e.clientY)) window.statusApp.setIgnoreMouseEvents(true);
  });

  hit.addEventListener('click', () => {
    if (didDrag) { didDrag = false; return; } // this click is just the tail end of a drag — ignore it
    window.statusApp.fabClicked();
  });

  hit.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    window.statusApp.showFabMenu();
  });

  // The window itself starts click-through (see main.js) — the entire
  // 67x67 window is otherwise a dead zone over whatever's underneath it
  // on the desktop, since a `transparent: true` Electron window is NOT
  // click-through by default even on its fully-transparent pixels. Flip
  // it back to interactive only while the cursor is actually over the
  // visible 55x55 icon, so nothing near it is blocked any more.
  // mouseenter/mouseleave still fire correctly in click-through mode
  // because main.js passes `forward: true`, which keeps mousemove-derived
  // events reaching this renderer even while clicks pass through.
  function isOverHit(clientX, clientY) {
    const r = hit.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }
  hit.addEventListener('mouseenter', () => window.statusApp.setIgnoreMouseEvents(false));
  hit.addEventListener('mouseleave', () => {
    if (!dragOrigin) window.statusApp.setIgnoreMouseEvents(true); // don't interrupt an in-progress drag
  });
</script>
</body>
</html>
